// OpenTDU night time (OTDU_ADDITION, mod pack).
// Read after FX/Weather.ini and FX/WeatherDesc.ini (GSConfig::parseWeatherAndFXInis):
// configs with a new name are added, a desc reusing an existing name replaces it.
// The FREERIDE desc below is retail's, with 3 dark night periods after each dusk
// (NIGHT_*) period. The moon is the "sun": same azimuth as retail's sun, 30 deg up.
// OTDU_UNLITSCALE scales unlit materials (particles, shore foam), OTDU_BAKEDSHADOW
// the baked sun shadows (terrain); both default to 1 (retail) in every other config.
// OTDU_LAMPS: street lamp intensity (FX/Lights_OpenTDU.ini, default 0 = off).
// OTDU_HDREXPOSURE: HDR exposure offset in stops (default 0 = retail); the eye
// adaptation lifts a dark scene up to 4.5x (MIDDLE_GRAY / MIN_AVG_LUM, FX.ini).
// The configs are also read as their HDR_ twins (Weather_HDRI.ini names).
// OTDU_EMISSIVE: scale of the unlit signs (emissive color or OTDU_EMISSIVETEXTURE,
// FX/Lights_OpenTDU.ini) instead of OTDU_UNLITSCALE; 1 = retail brightness.
// OTDU_STARS / OTDU_MOON: procedural stars and moon on the dome (default 0 = retail);
// the moon sits opposite the light direction, the sun sprite is hidden (alpha 0).
// HEIGHTMAPCOLOR is the terrain's light intensity (terrain ignores the sun light):
// scaled by the same night/day ratio as the sun diffuse + ambient (~0.37 x 0.31).

