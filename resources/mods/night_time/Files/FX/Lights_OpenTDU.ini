// OpenTDU night time (OTDU_ADDITION, mod pack): models that carry a light.
// Read by GSConfig::parseWeatherAndFXInis when a pack provides it.
// OTDU_LIGHTMODEL "MODEL" x y z r g b radius
//   One line per light: a model can carry several (double arm posts).
//   MODEL can also be the 0x hashcode shown by the debug object picker
//   (World > Object Picker), for names longer than 8 characters.
//   x y z: light position in object space (y up), r g b: color, radius: meters.
// The lamp intensity comes from the weather (OTDU_LAMPS, 0 = off).

[LIGHTS]
// Car headlights, on while the lamps are lit (the light key = high beams).
// OTDU_HEADLIGHTS r g b lowBeamRange highBeamRange outerAngle innerAngle pitch
//   intensity [tailLightLevel] (ranges in meters; cone half angles and
//   downward pitch in degrees; tailLightLevel = player brake light glow at
//   night, 0..1, default 0.35).
OTDU_HEADLIGHTS 1.0 0.95 0.85 45.0 90.0 30.0 12.0 3.0 3.0 0.35

// Lit windows: the building gloss maps mark the windows; at night a fraction
// of them glow (per window and floor, stable per building).
// OTDU_WINDOWS warmR warmG warmB litFraction coolR coolG coolB coolRatio
//   intensity (coolRatio = share of the lit windows using the cool color).
// OTDU_WINDOWPROFILE "PREFIX" (same values): models whose name starts with
//   PREFIX; the longest matching prefix wins. "0x..." = one model hashcode
//   (as the object picker shows it). Zero intensity = no windows.
OTDU_WINDOWS 1.0 0.75 0.45 0.35 0.75 0.85 1.0 0.25 0.8
// Houses / suburbs: warmer.
OTDU_WINDOWPROFILE "SB_" 1.0 0.70 0.40 0.35 0.75 0.85 1.0 0.10 0.8
// Warehouses / industrial: colder.
OTDU_WINDOWPROFILE "WH_" 1.0 0.80 0.55 0.35 0.80 0.90 1.0 0.70 0.8
// Parked cars (traffic models as props): their paint gloss is not a window
// mask. Zero intensity = no windows.
OTDU_WINDOWPROFILE "COMP" 0 0 0 0 0 0 0 0 0
OTDU_WINDOWPROFILE "PICKUP" 0 0 0 0 0 0 0 0 0
OTDU_WINDOWPROFILE "SUV" 0 0 0 0 0 0 0 0 0
OTDU_WINDOWPROFILE "BOX" 0 0 0 0 0 0 0 0 0
OTDU_WINDOWPROFILE "FU_POMP" 0 0 0 0 0 0 0 0 0
// Gallery with glossy marble (no windows).
OTDU_WINDOWPROFILE "0x59524C4C475F96B2" 0 0 0 0 0 0 0 0 0
// Pools (glossy water).
OTDU_WINDOWPROFILE "POOL" 0 0 0 0 0 0 0 0 0
// OTDU_WINDOWSPOTRADIUS meters: no windows near a building spot (houses,
// dealers, shops, clubs, drive-ins, rentals, real estate: every spot but the
// challenges); their gloss slot holds light maps and shiny trims.
OTDU_WINDOWSPOTRADIUS 80.0
// Spots keep their baked light maps in the gloss slot (names collected
// from every Level/Hawai/Spots bank).
// OTDU_WINDOWEXCLUDE "TEXTURE": materials whose gloss map is TEXTURE.
