; OpenTDU input template (see source/input/input_templates.h)
;
; [Template]
;   Name  = shown in the PRESETS tab of the key mapping screen
;   Match = Gamepad            any controller with an SDL gamepad mapping
;   Match = VidPid 046d:c24f   USB vendor:product (hex)
;   Match = Guid <32 hex>      SDL joystick GUID
;   Match = Name "G29"         substring of the product name
;
; [Bindings]
;   <ACTION> = <CHANNEL> [Inverted]   (an action can be listed several times)
;   Channel names are the ones DevicesPC.ini uses (BUTTON_n, POV_0_UP,
;   LEFT/RIGHT/UP/DOWN, STICK_1_*, WHEEL_UP/WHEEL_DOWN...). On an SDL gamepad
;   BUTTON_0..9 = A, B, X, Y, LB, RB, Back, Start, L3, R3 and WHEEL_DOWN/UP are
;   the right/left triggers.

[Template]
Name  = "Gamepad"
Match = Gamepad

[Bindings]
CAR_ACCEL          = WHEEL_DOWN
CAR_BRAKE          = WHEEL_UP
CAR_LEFT           = LEFT
CAR_RIGHT          = RIGHT
CAR_HBRAKE         = BUTTON_0

BIKE_ACCEL         = WHEEL_DOWN
BIKE_BRAKE         = WHEEL_UP
BIKE_LEFT          = LEFT
BIKE_RIGHT         = RIGHT

CAR_GUP            = BUTTON_5
CAR_GDOWN          = BUTTON_4
BIKE_GUP           = BUTTON_5
BIKE_GDOWN         = BUTTON_4

CAR_CAMERA         = BUTTON_3
CAR_BACKVIEW       = BUTTON_1
CAR_HORN           = BUTTON_8
BOT_PAD            = BUTTON_2
MAP                = BUTTON_6

CAR_HEAD_LEFT      = STICK_1_LEFT
CAR_HEAD_RIGHT     = STICK_1_RIGHT
CAR_HEAD_UP        = STICK_1_UP
CAR_HEAD_DOWN      = STICK_1_DOWN
CAR_HEAD_CENTER    = BUTTON_9

IN_GAME_MENU_UP    = POV_0_UP
IN_GAME_MENU_DOWN  = POV_0_DOWN
IN_GAME_MENU_LEFT  = POV_0_LEFT
IN_GAME_MENU_RIGHT = POV_0_RIGHT

MENU_UP            = POV_0_UP
MENU_DOWN          = POV_0_DOWN
MENU_LEFT          = POV_0_LEFT
MENU_RIGHT         = POV_0_RIGHT
MENU_UP            = UP
MENU_DOWN          = DOWN
MENU_LEFT          = LEFT
MENU_RIGHT         = RIGHT
MENU_VALIDATE      = BUTTON_0
MENU_BACK          = BUTTON_1
MENU_PAUSE         = BUTTON_7
MENU_SORT_LEFT     = BUTTON_4
MENU_SORT_RIGHT    = BUTTON_5
